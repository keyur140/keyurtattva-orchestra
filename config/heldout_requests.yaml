# Licence: CC BY 4.0
#
# Written on 2026-10-30, after the parser rules were frozen, and NOT used to change any rule.
# Source: the author's own song descriptions for KeyurTattva, written before this project
# (the "Music Style" and arrangement notes of 15 songs). The AI assistant condensed each one
# into a single request in the author's words, left out lyrics and artist names, and proposed
# the targets using the same conventions as config/requests.yaml (trap or boom-bap drums =
# percussion; 808, synths and pads = electronic; rap and choir = voices); the author accepted them.
# Families: strings, woodwinds, brass, percussion, keyboards, voices, world, electronic.
# Shapes: crescendo, decrescendo, arch, terraced, flat.
version: 1
requests:
  - {id: h01, text: "A rap fusion song that opens with temple bells and a soft sitar drone, drops into 808 trap bass with tabla rhythms, adds deep monk-like choir chants on the hook, strips down to bansuri flute and low hums for the bridge, and ends with a whispered outro fading into silence.", targets: {families: [percussion, voices, world, electronic], form: song, shape: terraced}}
  - {id: h02, text: "A sacred rap fusion track: a haunting bansuri intro over a tanpura drone with whispered chants, verses on heavy 808s and trap drums fused with mridangam and tabla, a mantra-like hook with layered vocals and a low monk choir, a minimal bridge of bansuri and an echoing voice, and an outro that fades out on the drone with whispers.", targets: {families: [percussion, voices, world, electronic], form: song, shape: terraced}}
  - {id: h03, text: "A high-energy epic trap anthem with war drums: fast 808s with mridangam and dhol thumps like marching to battle, electric sitar riffs under warrior chants, a hook that explodes with choir and gang shouts, a bridge that slows to bansuri and heartbeat drums, then a final drop that hits even harder.", targets: {families: [percussion, voices, world, electronic], form: song, shape: terraced}}
  - {id: h04, text: "A dark, militant rap track mixing hard 808 trap beats with ancient Indian tones: a deep gong and eerie drone open it, then it drops into crushing bass and snare rolls, distorted sitar plucks cut through with haunting whispers, the hooks are gang chants like an army of voices, and the bridge strips to bansuri and whispers before exploding back into the beat.", targets: {families: [percussion, voices, world, electronic], form: song, shape: terraced}}
  - {id: h05, text: "A trap and desi hip-hop fusion track at 92 BPM with heavy 808s, tight hi-hats, punchy trap drums and layered sub-bass, a dark bansuri flute sample on the hook, and occasional orchestral hits like a movie villain's entry; arrogant and royal but calm like a monk.", targets: {families: [strings, brass, percussion, voices, world, electronic], form: song, shape: flat}}
  - {id: h06, text: "A dark trap rap track with eerie synths and a cinematic feel, aggressive and mysterious.", targets: {families: [percussion, voices, electronic], form: song, shape: flat}}
