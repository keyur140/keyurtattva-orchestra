  - {id: h08, text: "A smooth mid-tempo rap with chill jazzy piano undertones, calm and thoughtful.", targets: {families: [percussion, keyboards, voices], form: song, shape: flat}}
  - {id: h09, text: "A classic boom-bap hip-hop track with an intelligent flow, proud and streetwise.", targets: {families: [percussion, voices], form: song, shape: flat}}
  - {id: h10, text: "A fast-paced, energetic trap rap with hard 808s and a relentless, frenetic flow.", targets: {families: [percussion, voices, electronic], form: song, shape: flat}}
  - {id: h11, text: "A calm, reflective Indian trap street-rap track at 100 BPM with deep 808 bass, crisp snares and rolling hi-hats, atmospheric synth pads, and occasional subtle Indian flute or guitar licks.", targets: {families: [percussion, voices, world, electronic], form: song, shape: flat}}
  - {id: h12, text: "A dark, mellow rap track where slow beats are broken by sudden trap hits, mysterious and balanced between calm and aggression.", targets: {families: [percussion, voices], form: song, shape: terraced}}
  - {id: h13, text: "A cinematic, fiery rap track with orchestral strings and brass over a trap rhythm, inspirational and legendary.", targets: {families: [strings, brass, percussion, voices], form: song, shape: flat}}
  - {id: h14, text: "An epic rap track with a slow build-up to a hard-hitting trap finale, calm and eternally confident.", targets: {families: [percussion, voices], form: song, shape: crescendo}}
  - {id: h15, text: "A dark, philosophical conscious-trap and spiritual-drill track at 138 BPM in D minor with deep sliding 808s, crisp trap drums, slow echoing dark piano, bansuri flute, haunting ambient pads, mystical bell plucks, low cinematic strings and a subtle low choir. It opens with pads and flute, the full beat drops at the hook, strings add intensity in the second verse, the drums strip away for the bridge, the final hook hits at full power with the choir, and it fades out on flute and pads.", targets: {families: [strings, percussion, keyboards, voices, world, electronic], form: song, shape: terraced}}
