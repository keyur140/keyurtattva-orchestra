# Orchestral benchmark requests (fixed before data collection).
# Author: KEYUR SHAILESHKUMAR PATEL, ORCID https://orcid.org/0009-0008-5261-043X
# Licence: CC BY 4.0
#
# Each request has a free-text prompt and *targets* written by the author: the instrument
# families a listener would expect, the large-scale form, and the dynamic shape. Targets
# are the evaluation reference for every condition; they are never read by the pipeline.
# Families: strings, woodwinds, brass, percussion, keyboards, voices, world, electronic.
# Shapes: crescendo, decrescendo, arch, terraced, flat.
version: 1
requests:
